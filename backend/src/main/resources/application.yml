server:
  port: 8080

spring:
  datasource:
    # Local (Fase 1): default localhost:5432/treino casa com o serviço `db` do
    # docker-compose.yml (porta publicada 5432:5432). Quando a API rodar em
    # container (Fase 9), defina SPRING_DATASOURCE_URL apontando para o host
    # do serviço (ex.: jdbc:postgresql://db:5432/treino).
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/treino}
    username: ${SPRING_DATASOURCE_USERNAME:treino}
    password: ${SPRING_DATASOURCE_PASSWORD:treino}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
