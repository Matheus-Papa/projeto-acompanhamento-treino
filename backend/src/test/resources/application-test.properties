# Perfil de teste: espelha produção (schema só via Flyway, ddl-auto=validate).
spring.jpa.hibernate.ddl-auto=validate
# Segredo só para testes (>= 32 chars, exigido pelo JwtService); o valor do
# @DynamicPropertySource em AbstractIntegrationTest prevalece quando definido.
app.jwt.secret=segredo-de-teste-com-mais-de-32-caracteres-0123456789
# Mostra as migrations V1+V2 aplicadas no banco do container.
logging.level.org.flywaydb=INFO
